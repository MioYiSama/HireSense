version: '3.8'

services:
  neo4j:
    image: neo4j:5.15-community
    container_name: interview_kg_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # 暴露 Web 可视化管理界面端口
      - "7687:7687"   # 暴露 Bolt 协议端口（Python 代码连接用）
    environment:
      - NEO4J_AUTH=neo4j/password  # 设置默认账号密码 (账号: neo4j, 密码: password)
      # 如果需要分配更大的内存给 Neo4j，可以取消下面两行的注释
      # - NEO4J_dbms_memory_heap_initial__size=1G
      # - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      # 【核心配置：本地目录挂载】
      # 冒号左边：宿主机（你电脑上）的本地相对路径
      # 冒号右边：Docker 容器内部的绝对路径
      - ./neo4j_data/data:/data        # 数据库核心数据保存目录 (读取和写入都在这里)
      - ./neo4j_data/logs:/logs        # 运行日志保存目录
      - ./neo4j_data/import:/var/lib/neo4j/import  # 供 LOAD CSV 等导入命令使用的目录
      - ./neo4j_data/plugins:/plugins  # 存放 APOC 等扩展插件的目录