[project]
name = "hiresense-ai"
version = "0.1.0"
description = "AI interview agent service for HireSense"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb==0.5.20",
    "fastapi==0.115.0",
    "httpx==0.27.2",
    "langchain-core==0.3.15",
    "langchain-openai==0.2.6",
    "langchain-text-splitters==0.3.2",
    "neo4j==5.25.0",
    "overrides==7.7.0",
    "pydantic==2.10.2",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",
    "sentence-transformers==3.3.1",
    "uvicorn[standard]==0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
